<!DOCTYPE html>
<html>
    <head>
        <title>Dashboard</title>
        <link rel="stylesheet" href="style.css">
        <meta charset="UTF-8">
    </head>
    <body class="body-dashboard">
        <div class="padding-dashboard">
            <input class="select" id="search" placeholder="Search challenges" oninput="loadChallenges()">
            <div class="select-wrapper">
                <select id="category-filter" onchange="loadChallenges()">
                    <option value="">All Categories</option>
                    <option value="Web">Web</option>
                    <option value="Crypto">Crypto</option>
                </select>
            </div>
            <div class="select-wrapper">
                <select id="difficulty-filter" onchange="loadChallenges()">
                    <option value="">All Difficulty</option>
                    <option value="Easy">Easy</option>
                    <option value="Medium">Medium</option>
                    <option value="Hard">Hard</option>
                </select>
            </div>
            <div class="select-wrapper">
                <select id="sort-filter" onchange="loadChallenges()">
                    <option value="">Sort By</option>
                    <option value="points">Points</option>
                    <option value="solves">Solves</option>
                </select>
            </div>
        </div>

        <!-- #flag{why_are_you_here_??} -->

        <div class="layout">
            <aside class="sidebar">
                <h2>CTF</h2>
                <a onclick="showChallenges()">Challenges</a>
                <a onclick="showScoreboard()">Scoreboard</a>
            </aside>

            <main class="content">
                <div id="challenges-section">
                    <h2 class="h2-dashboard">Dashboard</h2>
                    <span class="span-dashboard" id="username-display"></span>
                    <div id="challenges"></div>
                </div>
                
                <div id="scoreboard-section" style="display:none;">
                    <h2>Scoreboard</h2>
                    <div id="scoreboard"></div>
                </div>

                <div id="activity-section">
                    <h2 class="h2-dashboard">Recent Activity</h2>
                    <div id="activity"></div>
                </div>
            </main>

            <div class="progress-bar">
                <div id="progress-fill"></div>
                <button onclick="logout()">Logout</button>
            </div>

        </div>
        <script src="script.js"></script>
        <div id="toast" class="toast"></div>
    </body>
</html>
