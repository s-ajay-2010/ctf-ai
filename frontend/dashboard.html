<!DOCTYPE html>
<html>
    <head>
        <title>Dashboard</title>
        <link rel="stylesheet" href="/frontend/style.css">
        <meta charset="UTF-8">
    </head>
    <body>
        <input id="search" placeholder="Search challenges!!" oninput="loadChallenges()">
        <select id="category-filter" onchange="loadChallenges()">
            <option value="">All Categories</option>
            <option value="Web">Web</option>
            <option value="Crypto">Crypto</option>
        </select>

        <select id="difficulty-filter" onchange="loadChallenges()">
            <option value="">All Difficulty</option>
            <option value="Easy">Easy</option>
            <option value="Medium">Medium</option>
            <option value="Hard">Hard</option>
        </select>

        <select id="sort-filter" onchange="loadChallenges()">
            <option value="">Sort By</option>
            <option value="">Points</option>
            <option value="solves">Solves</option>
        </select>

        <!-- #flag{why_are_you_here_??} -->

        <div class="layout">
            <aside class="sidebar">
                <h2>CTF</h2>
                <a onclick="showChallenges()">Challenges</a>
                <a onclick="showScoreboard()">Scoreboard</a>
            </aside>

            <main class="content">
                <div id="challenges-section">
                    <h2>Dashboard</h2>
                    <span id="username-display"></span>
                    <button onclick="logout()">Logout</button>
                    <div id="challenges"></div>
                </div>
                
                <div id="scoreboard-section" style="display:none;">
                    <h2>Scoreboard</h2>
                    <div id="scoreboard"></div>
                </div>

                <div id="activity-section">
                    <h2>Recent Activity</h2>
                    <div id="activity"></div>
                </div>
            </main>

            <div class="progress-bar">
                <div id="progress-fill"></div>
            </div>

        </div>
        <script src="/frontend/script.js"></script>
        <div id="toast" class="toast"></div>
    </body>
</html>
