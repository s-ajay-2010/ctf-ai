<!DOCTYPE html>
<html>
    <head>
        <title>Dashboard</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <input id="search" placeholder="Search challenges!!" oninput="loadChallenges()">
        <select id="category-filter" onchange="loadChallenges()">
            <option value="">All Categories</option>
            <option value="Web">Web</option>
            <option value="Crypto">Crypto</option>
        </select>

        <select id="difficulty-filter" onchange="loadChallenges()">
            <option value="">All Difficulty</option>
            <option value="Easy">Easy</option>
            <option value="Medium">Medium</option>
            <option value="Hard">Hard</option>
        </select>

        <div class="layout">
            <aside class="sidebar">
                <h2>CTF</h2>
                <a onclick="loadChallenges()">Challenges</a>
                <a onclick="loadScoreboard()">Scoreboard</a>
            </aside>

            <main class="content">
                <h2>Dashboard</h2>
                <span id="username-display"></span>
                <button onclick="logout()">Logout</button>
                <div id="challenges"></div>

                <h2>Scoreboard</h2>
                <div id="scoreboard"></div>
            </main>

            <div class="progress-bar">
                <div id="progress-fill"></div>
            </div>

        </div>
        <script src="script.js"></script>
        <div id="toast" class="toast"></div>

        <h2> Recent Activity</h2>
        <div id="activity"></div>
    </body>
</html>
