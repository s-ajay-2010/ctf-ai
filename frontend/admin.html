<!DOCTYPE html>
<html>
    <head>
       <title>Admin Panel</title>
       <link rel="stylesheet" href="style.css">
       <meta charset="UTF-8">
    </head>
    <body>
        <h2>Admin Panel</h2>
        <div class="card-admin">
            <h3>Create Challenge</h3>
            <input id="title" placeholder="Title"><br><br>
            <input id="desc" placeholder="Description"><br><br>
            <input id="flag" placeholder="Flag"><br><br>
            <input id="points" placeholder="Points"><br><br>
            <div class="select-wrapper">
                <select id="category">
                    <option value="">Category</option>
                    <option value="Web">Web</option>
                    <option value="Crypto">Crypto</option>
                    <option value="Both">Both</option>
                </select>
            </div><br><br>
            <div class="select-wrapper">
                <select id="difficulty">
                    <option value="">Difficulty</option>
                    <option value="Easy">Easy</option>
                    <option value="Medium">Medium</option>
                    <option value="Hard">Hard</option>
                </select>
            </div><br><br>
            <input id="hints" placeholder="Hints(comma separated)"><br><br>
                
            <button onclick="createChallenge()">Create</button>
            <p id="msg"></p>
        </div>

        <script src="script.js"></script>
        <button onclick="logout()">Logout</button>

        <h3>Existing Challenges</h3>
        <div id="admin-challenges"></div>
        <div id="toast" class="toast"></div>
        
    </body>
</html>
