<!DOCTYPE html>
<html>
    <head>
        <title>Sign-Up</title>
        <link rel="stylesheet" href="/style.css">
        <meta charset="UTF-8">
    </head>
    <body>
        <div class="auth-container">
            <div class="auth-card">
                <h2>Sign-Up</h2>
                <input id="username" placeholder="Username"><br><br>
                <div class="password-box">
                    <input id="password" type="password" placeholder="Password">
                    <img id="eyeIcon" class="eye" src="assets/eye-closed.png" onclick="togglePassword()">
                </div>
                <button onclick="signup()">Demo Deployment</button>
            </div>
        </div>
        <script src="/script.js"></script>
    </body>
</html>
